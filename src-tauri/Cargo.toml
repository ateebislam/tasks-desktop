[package]
name = "tasks"
version = "0.21.0"
description = "A simple personal task manager"
edition = "2021"

# Keeps this project self-contained, even if stray files end up in the folder above.
[workspace]

[lib]
name = "tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri and its plugins are held to the same minor versions as their JavaScript halves in package.json (0.20.3):
# Tauri refuses to build when the two sides drift apart. Raise both together.
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-updater = "~2.14"
tauri-plugin-process = "~2.4"
tauri-plugin-notification = "~2.7"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-single-instance = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
notify = { version = "8", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Reads how long the computer has been idle (for idle detection), and shapes and blurs the quick capture window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }

# On a Mac (0.21.1), watch folders use macOS's own file events.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
